services:
  database:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_pass}
      # Hasła dla skryptu init-db.sh:
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      COMMUNITY_DB_PASSWORD: ${COMMUNITY_DB_PASSWORD:-comm_pass}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-cat_pass}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-ord_pass}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-rep_pass}
    ports:
      - "5432:5432"
    volumes:
      - posgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-rabbit_user}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-rabbit_pass}
    ports:
      - "5672:5672" 
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api-gateway:
    build: ./backend/src/Services/Api
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080 # <-- WYMUSZENIE PORTU
    depends_on:
      - database
      - order-service
      - auth-service

  auth-service:
    build: ./backend/src/Services/Auth
    container_name: auth-service
    environment:
      - ASPNETCORE_HTTP_PORTS=8080 # <-- WYMUSZENIE PORTU
      - DATABASE_URL=Host=database;Port=5432;Database=${POSTGRES_DB:-app_db};Username=auth_user;Password=${AUTH_DB_PASSWORD:-auth_pass}
    depends_on:
      - database

  order-service:
    build: ./backend/src/Services/Order
    container_name: order-service
    environment:
      DATABASE_URL: Host=database;Port=5432;Database=${POSTGRES_DB:-app_db};Username=orders_user;Password=${ORDERS_DB_PASSWORD:-ord_pass}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit_user}:${RABBITMQ_DEFAULT_PASS:-rabbit_pass}@rabbitmq:5672
    depends_on:
      - database
      - rabbitmq

  catalog-service:
    build: ./backend/src/Services/Catalog
    container_name: catalog-service
    environment:
      DATABASE_URL: Host=database;Port=5432;Database=${POSTGRES_DB:-app_db};Username=catalog_user;Password=${CATALOG_DB_PASSWORD:-cat_pass}
    depends_on:
      - database

  community-service:
    build: ./backend/src/Services/Community
    container_name: community-service
    environment:
      DATABASE_URL: Host=database;Port=5432;Database=${POSTGRES_DB:-app_db};Username=community_user;Password=${COMMUNITY_DB_PASSWORD:-comm_pass}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit_user}:${RABBITMQ_DEFAULT_PASS:-rabbit_pass}@rabbitmq:5672
    depends_on:
      - database
      - rabbitmq

  report-service:
    build: ./backend/src/Services/Report
    container_name: report-service
    environment:
      DATABASE_URL: Host=database;Port=5432;Database=${POSTGRES_DB:-app_db};Username=report_user;Password=${REPORT_DB_PASSWORD:-rep_pass}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbit_user}:${RABBITMQ_DEFAULT_PASS:-rabbit_pass}@rabbitmq:5672
    depends_on:
      - database
      - rabbitmq

  enrollment-service:
    build: ./backend/src/Services/Enrollment
    container_name: enrollment-service
    environment:
      # UWAGA: W Twoim init-db.sh nie było użytkownika enrollment_user. 
      # Używam głównego konta, ale powinieneś go dodać do skryptu w przyszłości.
      DATABASE_URL: Host=database;Port=5432;Database=${POSTGRES_DB:-app_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_pass}
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: frontend-app
    ports:
      - "5173:5173"
    environment:
      # Zmieniony port na 8080, aby frontend uderzał w API Gateway
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - api-gateway
    volumes:
      - ./frontend:/app 
      - /app/node_modules

volumes:
  posgres_data:
  rabbitmq_data: